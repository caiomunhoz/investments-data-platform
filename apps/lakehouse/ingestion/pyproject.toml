[project]
name = "ingestion"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"

dependencies = [
    "cryptography>=50.0.1",
    "dlt[filesystem]>=1.30.0",
    "msal>=1.39.0",
    "pdfplumber>=0.11.10",
    "pendulum>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.hatch.build.targets.wheel.force-include]
".dlt" = ".dlt"

[dependency-groups]
dev = [
    "boto3>=1.43.75",
]
